<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="Skandic Shop — галерея аутентичной одежды, обуви и вещей с историей.">
  <title>Skandic Shop — вещи с характером</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* 1. Цвета, шрифты и общие правила страницы */
    :root {
      color-scheme: light;
      --paper: #f4efe6;
      --paper-2: #fffdf8;
      --ink: #1e1e1a;
      --muted: #6f6d63;
      --olive: #3b4a3a;
      --olive-soft: #e2e5d9;
      --clay: #a8452a;
      --line: rgba(30, 30, 26, .12);
      --shadow: 0 18px 45px rgba(50, 45, 34, .10);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 var(--sans);
      transition: background .3s ease, color .3s ease;
    }
    body.dark {
      color-scheme: dark;
      --paper: #20231d;
      --paper-2: #292d26;
      --ink: #f4efe6;
      --muted: #b7b6a9;
      --olive: #bac5a8;
      --olive-soft: #343a30;
      --clay: #e58b69;
      --line: rgba(244, 239, 230, .13);
      --shadow: 0 18px 45px rgba(0, 0, 0, .22);
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #bd775d;
      outline-offset: 3px;
    }
    button { cursor: pointer; }
    .shell { max-width: 1440px; margin: auto; padding: 0 6.1%; }
    /* 2. Шапка сайта и главная обложка */
    .topbar {
      height: 88px; display: flex; align-items: center; justify-content: space-between;
      gap: 30px; border-bottom: 1px solid var(--line);
    }
    .brandmark { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
    .brand-icon {
      display: grid; place-items: center; width: 39px; height: 39px; border-radius: 50%;
      background: var(--olive); color: var(--paper); font: 600 18px var(--serif);
    }
    .brand-name { font: 600 21px var(--serif); letter-spacing: -.5px; }
    .top-links { display: flex; align-items: center; gap: 32px; }
    .top-links button, .icon-button {
      padding: 8px 0; border: 0; background: transparent; color: inherit;
      font-size: 13px; font-weight: 600; letter-spacing: .04em;
    }
    .top-links button:hover { color: var(--clay); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button {
      position: relative; display: grid; place-items: center; width: 42px; height: 42px;
      border-radius: 50%; transition: background .2s, transform .2s;
    }
    .icon-button:hover { background: var(--olive-soft); transform: translateY(-2px); }
    .count-dot {
      position: absolute; top: 2px; right: 0; display: grid; place-items: center;
      min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px;
      background: var(--clay); color: white; font-size: 10px; line-height: 1;
    }
    .icon { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    main { min-height: 65vh; }
    .hero {
      min-height: min(660px, 70vw); position: relative; overflow: hidden; display: flex;
      align-items: flex-end; border-radius: 0 0 30px 30px; color: white;
      background:
        linear-gradient(90deg, rgba(20, 25, 20, .58), rgba(20, 25, 20, .04) 80%),
        linear-gradient(0deg, rgba(16, 20, 16, .6), transparent 68%),
        url("IMG_1750.JPG") center 43%/cover;
    }
    .hero-inner { width: 100%; padding: 70px 8.5% 68px; }
    .eyebrow {
      display: flex; align-items: center; gap: 10px; margin: 0 0 17px;
      font-size: 11px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
    h1, h2, h3, p { margin-top: 0; }
    .hero h1 {
      max-width: 760px; margin-bottom: 20px; font: 500 clamp(54px, 8.1vw, 112px)/.98 var(--serif);
      letter-spacing: -.055em;
    }
    .hero-copy { max-width: 410px; margin-bottom: 29px; color: rgba(255,255,255,.86); font-size: 16px; }
    .button {
      min-height: 48px; display: inline-flex; align-items: center; justify-content: center;
      gap: 11px; padding: 0 21px; border: 0; border-radius: 99px; background: var(--olive);
      color: #fff; font-weight: 600; text-decoration: none;
      transition: transform .24s cubic-bezier(.2,.8,.2,1.3), box-shadow .2s, background .2s;
    }
    .button:hover { transform: translateY(-3px); box-shadow: 0 9px 22px rgba(35,45,33,.2); }
    .button:active { transform: scale(.97); }
    .button.cream { background: var(--paper-2); color: var(--ink); }
    .button.clay { background: var(--clay); color: white; }
    .button.outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .button.small { min-height: 41px; padding: 0 16px; font-size: 13px; }
    /* 3. Главная страница: блоки журнала и подборки */
    .section { padding: 68px 0; }
    .section-heading {
      display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 27px;
    }
    .section-heading h2, .page-title {
      margin: 0; font: 500 clamp(32px, 4vw, 48px)/1.1 var(--serif); letter-spacing: -.04em;
    }
    .section-heading p { max-width: 380px; margin: 0; color: var(--muted); font-size: 14px; }
    .text-link {
      display: inline-flex; align-items: center; gap: 9px; border: 0; padding: 6px 0;
      background: transparent; color: var(--olive); font-size: 13px; font-weight: 700;
    }
    .text-link:hover { color: var(--clay); }
    .news-row {
      display: grid; grid-auto-columns: minmax(260px, 1fr); grid-auto-flow: column;
      gap: 17px; overflow-x: auto; padding: 2px 2px 15px; scrollbar-width: thin;
      scrollbar-color: #b9b8a9 transparent;
    }
    .news-card {
      position: relative; min-height: 270px; overflow: hidden; display: flex; align-items: end;
      border-radius: 22px; background-position: center; background-size: cover; color: white;
      box-shadow: var(--shadow);
    }
    .news-card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(22,25,20,.78), transparent 72%); }
    .news-card-content { position: relative; width: 100%; padding: 23px; }
    .news-date { margin-bottom: 7px; color: rgba(255,255,255,.8); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .news-card h3 { max-width: 280px; margin: 0; font: 500 23px/1.16 var(--serif); }
    .news-arrow {
      position: absolute; right: 21px; bottom: 23px; display: grid; place-items: center;
      width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.45); border-radius: 50%;
      background: rgba(255,255,255,.13); color: white; backdrop-filter: blur(8px);
    }
    .manifesto {
      display: grid; grid-template-columns: 1fr .8fr; align-items: center; gap: 50px;
      padding: 54px 7%; border-radius: 26px; background: var(--olive-soft);
    }
    .manifesto h2 { margin: 0; font: 500 clamp(30px, 4vw, 48px)/1.12 var(--serif); }
    .manifesto p { margin: 0; color: var(--muted); }
    /* 4. Каталог, карточки товаров и фильтры */
    .page { padding: 48px 0 90px; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 29px; }
    .page-head .eyebrow { color: var(--muted); margin-bottom: 10px; }
    .page-title { font-size: clamp(38px, 5vw, 58px); }
    .catalog-tools { margin-bottom: 28px; }
    .search-row { display: flex; gap: 12px; align-items: center; margin-bottom: 15px; }
    .search-box {
      height: 48px; flex: 1; display: flex; align-items: center; gap: 11px; padding: 0 15px;
      border: 1px solid var(--line); border-radius: 99px; background: var(--paper-2);
    }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); }
    .search-box input::placeholder { color: var(--muted); }
    .currency-switch {
      display: flex; padding: 4px; border-radius: 99px; background: var(--olive-soft);
    }
    .currency-switch button {
      min-width: 48px; height: 37px; border: 0; border-radius: 99px; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700; transition: .2s;
    }
    .currency-switch button.active { background: var(--paper-2); color: var(--ink); box-shadow: 0 2px 9px rgba(30,30,26,.1); }
    .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .filter-select {
      height: 39px; padding: 0 31px 0 14px; border: 1px solid var(--line); border-radius: 99px;
      background: var(--paper-2); color: var(--ink); font-size: 12px; cursor: pointer;
    }
    .results-count { margin-left: auto; color: var(--muted); font-size: 12px; }
    /* Пометка о том, что карточки с фото пока являются витриной-примером. */
    .catalog-note { margin: -12px 0 20px; color: var(--muted); font-size: 12px; }
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 27px 19px; }
    .product-card { min-width: 0; animation: appear .5s both; }
    .product-card[data-product-link] { cursor: pointer; }
    .product-visual {
      position: relative; overflow: hidden; aspect-ratio: .79; padding: 10px; border-radius: 19px;
      background: var(--plate, #e5dfd3);
    }
    .product-visual img {
      display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 13px;
      transition: transform .5s cubic-bezier(.2,.7,.25,1);
    }
    .product-card:hover .product-visual img { transform: scale(1.055); }
    .badge {
      position: absolute; top: 19px; left: 18px; padding: 6px 11px; border-radius: 99px;
      background: var(--paper-2); color: var(--ink); font-size: 10px; font-weight: 700;
    }
    .badge.discount { top: auto; bottom: 18px; background: var(--clay); color: white; }
    .heart-button {
      position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 39px;
      height: 39px; border: 0; border-radius: 50%; background: rgba(255,253,248,.88);
      color: var(--ink); transition: transform .25s cubic-bezier(.2,.8,.2,1.5), color .2s;
    }
    .heart-button:hover { transform: scale(1.12); }
    .heart-button.saved { color: var(--clay); }
    .heart-button.saved svg { fill: currentColor; }
    .product-info { padding: 14px 3px 0; }
    .product-brand { margin: 0 0 4px; color: var(--muted); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; }
    .product-name { min-height: 43px; margin: 0 0 9px; font: 500 17px/1.25 var(--serif); }
    .product-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .price { font-size: 15px; font-weight: 700; }
    .old-price { margin-left: 7px; color: var(--muted); font-size: 12px; font-weight: 400; text-decoration: line-through; }
    .size-note { color: var(--muted); font-size: 11px; }
    .add-button {
      width: 100%; min-height: 41px; margin-top: 13px; border: 1px solid var(--line);
      border-radius: 99px; background: transparent; color: var(--ink); font-size: 12px;
      font-weight: 700; transition: background .2s, color .2s, transform .2s;
    }
    .add-button:hover { transform: translateY(-2px); background: var(--olive); color: white; border-color: var(--olive); }
    /* Страница товара: изображение, описание, выбор размера и характеристики. */
    .product-detail {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, .82fr);
      align-items: start; gap: clamp(30px, 6vw, 82px);
    }
    .detail-photo {
      position: relative; overflow: hidden; min-height: 460px; aspect-ratio: .88;
      padding: 14px; border-radius: 25px; background: var(--plate, #e5dfd3);
    }
    .detail-photo img { width: 100%; height: 100%; min-height: 432px; display: block; object-fit: contain; border-radius: 17px; }
    /* Листаемая галерея фотографий на странице товара. */
    .gallery-arrow {
      position: absolute; z-index: 2; top: 50%; display: grid; place-items: center;
      width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%;
      background: color-mix(in srgb, var(--paper-2) 88%, transparent); color: var(--ink);
      box-shadow: var(--shadow); transform: translateY(-50%);
    }
    .gallery-arrow:hover { background: var(--paper-2); }
    .gallery-arrow.previous { left: 22px; }
    .gallery-arrow.next { right: 22px; }
    .gallery-arrow.previous .icon { transform: rotate(180deg); }
    .gallery-footer {
      position: absolute; z-index: 2; right: 12px; bottom: 13px; left: 12px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .gallery-dot {
      display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
      border: 0; border-radius: 50%; background: color-mix(in srgb, var(--paper-2) 82%, transparent);
    }
    .gallery-dot::before { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); content: ""; }
    .gallery-dot.active::before { width: 16px; border-radius: 99px; background: var(--olive); }
    .gallery-count {
      position: absolute; z-index: 2; top: 18px; right: 18px; padding: 5px 10px;
      border-radius: 99px; background: color-mix(in srgb, var(--paper-2) 88%, transparent);
      color: var(--ink); font-size: 11px; font-weight: 700;
    }
    .detail-copy { padding: 12px 0; }
    .detail-copy h1 { margin: 0 0 16px; font: 500 clamp(36px, 5vw, 58px)/1.07 var(--serif); letter-spacing: -.04em; }
    .detail-description { margin: 23px 0; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .detail-price { display: flex; align-items: baseline; gap: 12px; margin: 24px 0; font-size: 25px; font-weight: 700; }
    .detail-price .old-price { font-size: 16px; }
    .price-note { margin: -15px 0 0; color: var(--muted); font-size: 11px; }
    .detail-label { display: block; margin: 22px 0 10px; font-size: 12px; font-weight: 700; }
    .size-options { display: flex; flex-wrap: wrap; gap: 9px; }
    .size-option { min-width: 46px; height: 43px; padding: 0 13px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper-2); color: var(--ink); }
    .size-option.active { border-color: var(--olive); background: var(--olive); color: var(--paper); }
    .detail-actions { display: flex; gap: 10px; margin-top: 24px; }
    .detail-actions .button { flex: 1; }
    .detail-facts { display: grid; gap: 0; margin-top: 28px; border-top: 1px solid var(--line); }
    .detail-fact { display: flex; justify-content: space-between; gap: 15px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .detail-fact span:first-child { color: var(--muted); }
    /* Кнопка возврата на страницах и переключатель доставки в корзине. */
    .page-backbar { padding-top: 21px; }
    .page-back { color: var(--muted); }
    .back-icon { transform: rotate(180deg); }
    .fulfillment-options { display: grid; gap: 9px; margin: 18px 0; }
    .fulfillment-option {
      display: flex; align-items: flex-start; gap: 11px; width: 100%; padding: 13px;
      border: 1px solid var(--line); border-radius: 15px; background: transparent;
      color: var(--ink); text-align: left;
    }
    .fulfillment-option.active { border-color: var(--olive); background: var(--olive-soft); }
    .fulfillment-radio { flex: 0 0 17px; width: 17px; height: 17px; margin-top: 2px; border: 1px solid var(--muted); border-radius: 50%; }
    .fulfillment-option.active .fulfillment-radio { border: 5px solid var(--olive); background: var(--paper-2); }
    .fulfillment-option strong, .fulfillment-option small { display: block; }
    .fulfillment-option small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .cart-continue { width: 100%; margin-top: 10px; }
    /* Диалог оформления заказа и адаптивная форма данных покупателя. */
    .checkout-overlay {
      position: fixed; z-index: 60; inset: 0; display: grid; place-items: center;
      padding: 22px; background: rgba(25, 27, 22, .58); backdrop-filter: blur(7px);
    }
    .checkout-modal {
      width: min(620px, 100%); max-height: min(90vh, 900px); overflow-y: auto;
      padding: clamp(20px, 4vw, 36px); border: 1px solid var(--line); border-radius: 25px;
      background: var(--paper); color: var(--ink); box-shadow: var(--shadow);
    }
    .checkout-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .checkout-heading h2 { margin: 0 0 7px; font: 500 34px/1.1 var(--serif); }
    .checkout-heading p { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    .checkout-close {
      flex: 0 0 40px; width: 40px; height: 40px; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 50%; background: var(--paper-2); color: var(--ink);
    }
    .checkout-form { display: grid; gap: 15px; }
    .checkout-field { display: grid; gap: 7px; color: var(--ink); font-size: 12px; font-weight: 700; }
    .checkout-field input, .checkout-field select, .checkout-field textarea {
      width: 100%; min-height: 46px; padding: 11px 13px; border: 1px solid var(--line);
      border-radius: 13px; background: var(--paper-2); color: var(--ink); font-size: 14px;
    }
    .checkout-field textarea { min-height: 88px; resize: vertical; }
    .checkout-fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .checkout-fields-grid[hidden], .checkout-delivery-note[hidden] { display: none; }
    .checkout-delivery-note {
      padding: 14px; border-radius: 15px; background: var(--olive-soft);
      color: var(--ink); font-size: 13px;
    }
    .checkout-delivery-note strong { display: block; margin-bottom: 4px; }
    .checkout-delivery-note p { margin: 0; color: var(--muted); }
    .checkout-total { display: flex; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--line); font-weight: 700; }
    .checkout-form .button { width: 100%; }
    .checkout-cancel { width: 100%; }
    /* Быстрые переходы из профиля к покупкам и корзине. */
    .profile-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: -13px 0 32px; }
    .empty-state {
      display: grid; justify-items: center; text-align: center; padding: 82px 20px;
      border-radius: 24px; background: var(--paper-2);
    }
    .empty-art {
      display: grid; place-items: center; width: 105px; height: 105px; margin-bottom: 24px;
      border-radius: 50%; background: var(--olive-soft); color: var(--olive);
    }
    .empty-state h2 { margin: 0 0 8px; font: 500 32px var(--serif); }
    .empty-state p { max-width: 390px; margin: 0 0 23px; color: var(--muted); }
    /* 5. Корзина, профиль и общие элементы навигации */
    .cart-layout { display: grid; grid-template-columns: 1fr 340px; align-items: start; gap: 35px; }
    .cart-list { display: grid; gap: 13px; }
    .cart-item {
      display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 16px;
      padding: 12px; border-radius: 18px; background: var(--paper-2);
    }
    .cart-item img { width: 92px; height: 110px; object-fit: cover; border-radius: 12px; }
    .cart-item h3 { margin: 0 0 5px; font: 500 18px var(--serif); }
    .cart-item p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .quantity { display: inline-flex; align-items: center; gap: 12px; padding: 4px; border-radius: 99px; background: var(--olive-soft); }
    .quantity button { display: grid; place-items: center; width: 27px; height: 27px; border: 0; border-radius: 50%; background: var(--paper-2); }
    .summary { position: sticky; top: 20px; padding: 24px; border-radius: 20px; background: var(--paper-2); }
    .summary h2 { margin: 0 0 19px; font: 500 26px var(--serif); }
    .summary-line { display: flex; justify-content: space-between; gap: 10px; margin: 10px 0; color: var(--muted); font-size: 13px; }
    .summary-total { margin: 18px 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink); font-size: 16px; font-weight: 700; }
    .summary .button { width: 100%; }
    .profile-card { display: flex; align-items: center; gap: 17px; margin-bottom: 22px; padding: 24px; border-radius: 22px; background: var(--olive-soft); }
    .avatar { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; background: var(--olive); color: var(--paper); font: 600 25px var(--serif); }
    .profile-card h2 { margin: 0 0 3px; font: 500 23px var(--serif); }
    .profile-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 20px 0 35px; padding: 22px 0; border-block: 1px solid var(--line); }
    .stat { text-align: center; }
    .stat strong { display: block; font: 500 28px var(--serif); }
    .stat span { color: var(--muted); font-size: 12px; }
    .settings-list { overflow: hidden; border-radius: 18px; background: var(--paper-2); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row span { font-size: 14px; font-weight: 600; }
    .setting-row select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); color: var(--ink); }
    .footer { padding: 28px 0 105px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

    function cartPage() {
      const entries = [...state.cart.entries()].map(([id, value]) => ({ product: products.find(product => product.id === id), ...value }));
      if (!entries.length) return `<section class="shell page"><div class="page-head"><div><p class="eyebrow">Всё самое нужное</p><h1 class="page-title">Корзина</h1></div></div><div class="empty-state"><div class="empty-art">${icon("bag")}</div><h2>Здесь пока свободно</h2><p>Добавьте вещь из каталога — и мы бережно отложим её для вас.</p><button class="button" data-page="catalog">Перейти в каталог ${icon("arrow")}</button></div></section>`;
      const total = entries.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
      return `<section class="shell page"><div class="page-head"><div><p class="eyebrow">Почти ваше</p><h1 class="page-title">Корзина</h1></div><span class="size-note">${cartCount()} товара</span></div>
        <div class="cart-layout"><div class="cart-list">${entries.map(({product, quantity, size}) => `<article class="cart-item"><img src="${photo(product.image, 300)}" alt="${product.name}"><div><p>${product.brand}</p><h3>${product.name}</h3><p>Размер: ${size}</p><div class="quantity" aria-label="Количество"><button data-quantity="${product.id}" data-change="-1" aria-label="Уменьшить количество">−</button><span>${quantity}</span><button data-quantity="${product.id}" data-change="1" aria-label="Увеличить количество">+</button></div></div><div style="text-align:right"><div class="price">${money(product.price * quantity)}</div><button class="text-link" style="font-size:11px" data-remove="${product.id}">Убрать</button></div></article>`).join("")}</div>

            <button class="fulfillment-option ${state.fulfillment === "pickup" ? "active" : ""}" data-fulfillment="pickup" aria-pressed="${state.fulfillment === "pickup"}"><span class="fulfillment-radio" aria-hidden="true"></span><span><strong>Самовывоз · Гродно</strong><small>Заберите заказ в удобное время</small></span></button>

    // Модальное окно с контактами покупателя и адресом получения заказа.

          </form>
        </section>

    function profilePage() {

        </div></section>`;
    }
    // 4. Защита текста поиска и сборка выбранной страницы.
    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function render() {
      document.body.classList.toggle("dark", state.dark);
      const pages = { home: homePage, catalog: () => catalogPage("catalog"), clothes: () => catalogPage("clothes"), shoes: () => catalogPage("shoes"), product: productPage, favorites: favoritesPage, cart: cartPage, profile: profilePage };
      // Общая кнопка возврата доступна на всех внутренних страницах.
      const backButton = state.page === "home" ? "" : `<div class="shell page-backbar"><button class="text-link page-back" data-back>${icon("arrow", "back-icon")} Назад</button></div>`;
      app.innerHTML = `${header()}<main>${backButton}${(pages[state.page] || homePage)()}</main>
        <footer class="shell footer"><div class="footer-inner"><span>© Skandic Shop, 2026 · Гродно</span><span>Выбирайте вещи, которые останутся.</span><span>Демо-проект · разработка <a href="https://t.me/Macount" target="_blank" rel="noopener">@Macount</a></span></div></footer>
        <nav class="bottom-nav" aria-label="Навигация по магазину">${navButton("clothes","Одежда","clothes")}${navButton("shoes","Обувь","shoes")}${navButton("favorites","Избранное","heart",state.favorites.size || "")}${navButton("cart","Корзина","bag",cartCount() || "")}${navButton("profile","Профиль","user")}</nav><div class="toast" role="status" aria-live="polite"></div>${checkoutModal()}`;
      if (state.checkoutOpen) document.getElementById("checkout-name")?.focus();
    }
    // 5. Действия пользователя: переходы, корзина, избранное и настройки.
    // Уведомление поддерживает действие для быстрого перехода в корзину.
    function toast(message, actionLabel = "", actionPage = "") {
      const node = document.querySelector(".toast");
      if (!node) return;
      node.innerHTML = `<span>${message}</span>${actionLabel && actionPage ? `<button class="toast-action" data-page="${actionPage}">${actionLabel}</button>` : ""}`;
      node.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => node.classList.remove("show"), 2100);
    }
    function navigate(page) {
      if (page !== state.page) state.navigationHistory.push(state.page);
      state.page = page;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    // Возврат на предыдущую посещённую страницу; если истории нет — в каталог.
    function goBack() {
      state.page = state.navigationHistory.pop() || "catalog";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    // Обработчики возврата, карточек товаров, доставки и действий с корзиной.
    app.addEventListener("click", event => {
      const target = event.target.closest("button, a, [data-product-link]") ||
        (event.target.matches("[data-checkout-overlay]") ? event.target : null);
      if (!target) return;
      if (target.matches("[data-close-checkout], [data-checkout-overlay]")) {
        state.checkoutOpen = false;
        render();
        return;
      }
      if (target.matches("[data-back]")) { goBack(); return; }
      if (target.matches("[data-fulfillment]")) {
        state.fulfillment = target.dataset.fulfillment;
        render();
        return;
      }
      if (target.matches("[data-page]")) {
        event.preventDefault();
        const page = target.dataset.page;
        if (page === "catalog") { state.category = "Все категории"; state.brand = "Все бренды"; state.size = "Любой размер"; state.query = ""; state.maxPrice = 0; }
        if (page === "shoes") state.category = "Обувь";
        if (page === "clothes") state.category = "Одежда";
        navigate(page);
      }
      if (target.matches("[data-product-link]") && !target.closest("button")) {
        state.returnPage = state.page;
        state.productId = Number(target.dataset.productLink);
        state.productImageIndex = 0;
        navigate("product");
      }
      if (target.matches("[data-gallery-step]")) {
        const product = products.find(item => item.id === state.productId);
        const images = product ? productPhotos(product) : [];
        if (images.length > 1) {
          state.productImageIndex = (state.productImageIndex + Number(target.dataset.galleryStep) + images.length) % images.length;
          render();
        }
        return;
      }
      if (target.matches("[data-gallery-index]")) {
        state.productImageIndex = Number(target.dataset.galleryIndex);
        render();
        return;
      }
      if (target.matches("[data-size]")) {
        state.productSizes.set(Number(target.dataset.sizeProduct), target.dataset.size);
        render();
      }
      if (target.matches("[data-theme]")) { state.dark = !state.dark; render(); }
      if (target.matches("[data-favorite]")) {
        const id = Number(target.dataset.favorite);
        state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
        render();
        toast(state.favorites.has(id) ? "Добавлено в избранное" : "Удалено из избранного");
      }
      if (target.matches("[data-add]")) {
        const id = Number(target.dataset.add);
        const product = products.find(item => item.id === id);
        const size = target.hasAttribute("data-add-size")
          ? state.productSizes.get(id) || product.sizes[0] || "уточнить"
          : product.sizes[0] || "уточнить";
        const current = state.cart.get(id) || { quantity: 0, size };
        state.cart.set(id, { quantity: current.quantity + 1, size });
        render();
        toast(`Добавлено в корзину · размер ${size}`, "Перейти", "cart");
      }
      if (target.matches("[data-quantity]")) {
        const id = Number(target.dataset.quantity);
        const item = state.cart.get(id);
        item.quantity += Number(target.dataset.change);
        if (item.quantity <= 0) state.cart.delete(id);
        render();
      }
      if (target.matches("[data-remove]")) { state.cart.delete(Number(target.dataset.remove)); render(); }
      if (target.matches("[data-currency]")) { state.currency = target.dataset.currency; render(); }
      if (target.matches("[data-checkout]")) {
        state.checkoutOpen = true;
        render();
      }
      if (target.matches("[data-support]")) toast("Напишите нам в Telegram: @skandicshop");
    });
    // Открытие страницы товара с клавиатуры клавишей Enter или пробелом.
    app.addEventListener("keydown", event => {
      if (event.key === "Escape" && state.checkoutOpen) {
        state.checkoutOpen = false;
        render();
        return;
      }
      if (!event.target.matches("[data-product-link]") || !["Enter", " "].includes(event.key)) return;
      event.preventDefault();
      const card = event.target;
      state.returnPage = state.page;
      state.productId = Number(card.dataset.productLink);
      state.productImageIndex = 0;
      navigate("product");
    });
    app.addEventListener("change", event => {
      const target = event.target;
      if (target.matches("[data-checkout-fulfillment]")) {
        state.fulfillment = target.value;
        const isPickup = state.fulfillment === "pickup";
        const deliveryFields = document.querySelector("[data-delivery-fields]");
        const pickupNote = document.querySelector("[data-pickup-note]");
        deliveryFields.hidden = isPickup;
        pickupNote.hidden = !isPickup;
        deliveryFields.querySelectorAll("input, select").forEach(field => { field.required = !isPickup; });
        const city = deliveryFields.querySelector('[name="city"]');
        city.value = isPickup ? "Гродно" : "";
        return;
      }
      if (target.matches("[data-filter]")) {
        state[target.dataset.filter] = target.value;
        render();
      }
      if (target.matches("[data-sort]")) { state.sort = target.value; render(); }
      if (target.matches("[data-price]")) { state.maxPrice = Number(target.value) || 0; render(); }
      if (target.matches("[data-profile-currency]")) { state.currency = target.value; render(); }
      if (target.matches("[data-language]")) { state.language = target.value; }
    });
    // Проверка обязательных полей и подтверждение заказа из формы.
    app.addEventListener("submit", event => {
      if (!event.target.matches("[data-checkout-form]")) return;
      event.preventDefault();
      const form = event.target;
      if (!form.reportValidity()) return;
      const formData = new FormData(form);
      const fulfillment = formData.get("fulfillment");
      state.fulfillment = fulfillment;
      state.orders += 1;
      state.cart.clear();
      state.checkoutOpen = false;
      navigate("profile");
      toast(`Заказ оформлен! ${fulfillment === "pickup" ? "Самовывоз в Гродно" : "Мы свяжемся для подтверждения доставки"}.`);
    });
    app.addEventListener("input", event => {
      if (!event.target.matches("[data-search]")) return;
      state.query = event.target.value;
      const start = event.target.selectionStart;
      const end = event.target.selectionEnd;
      render();
      const input = document.querySelector("[data-search]");
      input.focus();
      input.setSelectionRange(start, end);
    });
    render();
  </script>
</body>
</html>
